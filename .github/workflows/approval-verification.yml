name: Public release verification
run-name: Topoo request ${{ inputs.topoo_dispatch_nonce }}
on:
  workflow_dispatch:
    inputs:
      topoo_runner_labels:
        description: Dedicated verification Runner labels
        type: string
        required: true
      topoo_dispatch_nonce:
        description: Public correlation identifier
        type: string
        required: true
permissions: {}
jobs:
  prepare:
    name: Prepare verification
    runs-on: ${{ fromJSON(inputs.topoo_runner_labels) }}
    timeout-minutes: 3
    steps:
      - shell: bash
        run: 'true'
  verify:
    name: Verify public runtime
    needs: prepare
    environment: approval-verification
    runs-on: ${{ fromJSON(inputs.topoo_runner_labels) }}
    timeout-minutes: 3
    steps:
      - name: Check the public runtime version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          endpoint = "https://cloud.topoo.ai/__topoo/provider-version-health"
          request = urllib.request.Request(endpoint, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"})
          with opener.open(request, timeout=20) as response:
              version = response.headers["x-topoo-runtime-version"]
          if not re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", version):
              raise SystemExit("The public runtime version is unavailable.")
          print("Verified public Topoo runtime " + version)
          PYTHON
